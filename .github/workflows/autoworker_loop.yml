name: AutoWorker loop

# Invokes the chosen coding agent on a schedule to run ONE pass of the
# routine in RUNBOOK.md. The agent reads MASTER_DIRECTIVES.md + the
# tracker issue, decides what to do, and either comments / opens a PR /
# stays quiet.
#
# The `{{AGENT_INVOCATION}}` block below is filled in by the bootstrap
# from the adapter you chose (`adapters/<adapter>.md`). It typically
# calls the agent's CLI with the prompt from LOOP_PROMPT.md.
#
# Run this strictly AFTER the data ingest cron so the agent sees fresh
# tracker state. Either offset by a few minutes in the schedule, or
# (recommended) trigger this workflow from `workflow_run` of the data
# ingest workflow.

on:
  schedule:
    - cron: '5 * * * *'   # by default: ingest cron + offset
  workflow_dispatch: {}
  workflow_run:
    workflows: ['AutoWorker data ingest']
    types: [completed]

permissions:
  contents: write          # the agent commits to autoworker/* branches
  pull-requests: write     # opens + merges PRs per agent-config pre-auth
  issues: write            # comments on the tracker

concurrency:
  group: autoworker-loop
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config user.name "autoworker[bot]"
          git config user.email "autoworker@users.noreply.github.com"

      # === Agent invocation — filled in by bootstrap from your adapter ===
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run one AutoWorker pass
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude --print \
            --permission-mode acceptEdits \
            --allowed-tools "Bash,Read,Edit,Write,Grep,Glob,mcp__github__*" \
            < LOOP_PROMPT.md
      # =====================================================================
