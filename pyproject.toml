[project]
name = "autotrader-codex"
version = "0.1.0"
description = "Binance funding-rate arbitrage bot with FastAPI dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "ccxt>=4.4.30",
  "python-multipart>=0.0.12",
  "jinja2>=3.1.4"
]

[tool.uv]
dev-dependencies = ["pytest>=8.3.3", "ruff>=0.8.0"]
