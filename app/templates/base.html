<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Funding Arb{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>Funding Arb</h1>
    <div class="subtitle">Binance · Spot/Perp</div>
    <span class="mode-pill {{ 'paper' if state.paper_mode else 'live' }}">{{ 'PAPER' if state.paper_mode else 'LIVE' }}</span>
    {% if state.maintenance_mode %}<span class="mode-pill warn" style="background:#451a03;color:#fbbf24;">MAINTENANCE</span>{% endif %}
    <ul class="nav">
      <li><a href="/dashboard" class="{{ 'active' if active=='dashboard' }}">Dashboard</a></li>
      <li><a href="/positions" class="{{ 'active' if active=='positions' }}">Open positions</a></li>
      <li><a href="/portfolio" class="{{ 'active' if active=='portfolio' }}">Portfolio &amp; PnL</a></li>
      <li><a href="/logs" class="{{ 'active' if active=='logs' }}">Logs &amp; Scans</a></li>
      <li><a href="/config" class="{{ 'active' if active=='config' }}">Configuration</a></li>
      <li><a href="/safety" class="{{ 'active' if active=='safety' }}">Safety &amp; Rules</a></li>
    </ul>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
